<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roadmap Tube Pro</title>
    <style>
        :root {
            --yt-red: #FF0000;
            --primary-accent: #E53935;
            --bg-card: rgba(15, 23, 42, 0.85); 
            --bg-card-inner: rgba(30, 41, 59, 0.9);
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-blue: #38BDF8;
            --accent-green: #4ADE80;
            --accent-orange: #FB923C;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans JP", sans-serif; 
            color: var(--text-main); 
            padding-bottom: 90px; 
            line-height: 1.5; 
            /* 【背景の修正】ご提示いただいたクリエイティブを刺激するアイスホッケービジュアルを固定背景に設定 */
            background-image: linear-gradient(rgba(10, 16, 26, 0.55), rgba(10, 16, 26, 0.75)), url('https://images.unsplash.com/photo-1515703407324-5f753eed2079?auto=format&fit=crop&q=80&w=1280');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
        
        .app-header { 
            background-color: rgba(11, 19, 43, 0.8); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 16px; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 100; 
        }
        .app-logo { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; }
        .logo-icon { color: var(--yt-red); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .view-title { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); border: 1px solid rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
        
        .container { width: 100%; max-width: 540px; margin: 0 auto; padding: 16px; }
        
        .dashboard-hero { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; padding: 24px; margin-bottom: 24px; 
            border: 1px solid rgba(255,255,255,0.15); text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
        }
        .total-progress-circle { 
            width: 120px; height: 120px; border-radius: 50%; 
            background: conic-gradient(var(--primary-accent) 0%, rgba(255,255,255,0.1) 0%); 
            margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; position: relative; 
        }
        .total-progress-circle::after { content: ''; width: 100px; height: 100px; background: #0f172a; position: absolute; border-radius: 50%; z-index: 1; }
        .total-progress-text { position: relative; z-index: 2; font-size: 1.8rem; font-weight: 900; }
        
        .level-progress-card { 
            background: var(--bg-card); border-radius: 18px; padding: 16px; margin-bottom: 12px; 
            border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; 
            transition: all 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .level-progress-card:active { transform: scale(0.97); background: var(--bg-card-inner); }
        
        .progress-bar-bg { width: 100%; height: 8px; background-color: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #FF3B30, #FF9500); border-radius: 4px; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .level-tabs { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0 20px 0; scrollbar-width: none; }
        .level-tabs::-webkit-scrollbar { display: none; }
        .tab-chip { 
            background: rgba(255,255,255,0.12); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.15); 
            padding: 10px 20px; border-radius: 25px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; transition: all 0.2s;
        }
        .tab-chip.active { background: #FFF; color: #000; border-color: #FFF; box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        
        .yt-card { background: var(--bg-card); border-radius: 20px; margin-bottom: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .video-player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
        .video-thumb { width: 100%; height: 100%; object-fit: cover; }
        .video-mock-bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6));
        }
        .play-button-yt { width: 60px; height: 42px; background-color: rgba(255, 0, 0, 0.9); border-radius: 12px; display: flex; justify-content: center; align-items: center; border: none; box-shadow: 0 5px 20px rgba(255,0,0,0.4); }
        .play-icon { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 16px solid white; margin-left: 4px; }
        
        .video-info-block { display: flex; padding: 18px; gap: 16px; }
        
        .custom-checkbox { 
            width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.25); border-radius: 8px; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            background: var(--bg-card-inner); transition: all 0.2s;
        }
        .custom-checkbox.checked { background: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 15px rgba(48, 209, 88, 0.4); }
        .custom-checkbox::after { content: "✓"; color: transparent; font-weight: 900; font-size: 1.1rem; }
        .custom-checkbox.checked::after { color: #000; }
        .custom-checkbox input { display: none; }
        
        .video-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.3px; }
        .meta-tag { background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: #E2E8F0; margin-right: 6px; margin-bottom: 8px; display: inline-block; }
        .meta-tag.active-tag { color: var(--accent-orange); background: rgba(255, 159, 10, 0.2); }
        .point-caption { background: rgba(255,255,255,0.05); border-left: 4px solid var(--yt-red); padding: 12px; font-size: 0.9rem; color: #EEE; border-radius: 0 12px 12px 0; margin-top: 10px; }

        .guidance-img-box { width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background: #000; margin-top: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .guidance-img-box iframe { width: 100%; height: 450px; border: none; }
        
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 540px; 
            background-color: rgba(10, 16, 26, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; 
            padding: 12px 0 max(12px, env(safe-area-inset-bottom)) 0; z-index: 1000; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: #8E8E93; font-size: 0.75rem; font-weight: 700; gap: 6px; width: 33%; transition: all 0.2s; }
        .nav-item.active { color: #FFF; }
        .nav-icon { font-size: 1.5rem; transition: transform 0.2s; }
        .nav-item.active .nav-icon { transform: translateY(-3px); }
        
        .page-content { display: none; }
        .page-content.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="app-header">
    <div class="app-logo"><span class="logo-icon">▶</span> ROADMAP PRO</div>
    <div class="view-title" id="current-view-title">Dashboard</div>
</header>

<div class="container">

    <div id="page-dashboard" class="page-content active">
        <div class="dashboard-hero">
            <div class="total-progress-circle" id="total-circle"><span class="total-progress-text" id="total-percent">0%</span></div>
            <h2 style="font-size: 1.3rem;">Total Performance</h2>
            <p style="color: var(--text-sub); margin-top: 5px;">125種類のスキルドリルを完全制覇せよ</p>
        </div>
        <div id="dashboard-list"></div>
    </div>

    <div id="page-roadmap" class="page-content">
        <div class="level-tabs">
            <button class="tab-chip active" id="chip-lv1" onclick="switchLevel('lv1', '基礎習得')">基礎習得</button>
            <button class="tab-chip" id="chip-lv2" onclick="switchLevel('lv2', '応用展開')">応用展開</button>
            <button class="tab-chip" id="chip-lv3" onclick="switchLevel('lv3', '実戦準備')">実戦準備</button>
            <button class="tab-chip" id="chip-lv4" onclick="switchLevel('lv4', '試合出場')">試合出場</button>
            <button class="tab-chip" id="chip-lv5" onclick="switchLevel('lv5', 'レギュラー')">レギュラー</button>
        </div>
        <div id="level-container"></div>
    </div>

    <div id="page-mindset" class="page-content">
        <div style="margin-bottom: 24px;">
            <h2 style="color: var(--accent-orange); font-size: 1.1rem; margin-bottom: 8px; font-weight: 800;">📈 成長の仕方</h2>
            <div class="guidance-img-box">
                <iframe src="https://drive.google.com/file/d/1WzOYPQUVpG1CtoNnfMDRmX4PT49zBfXl/preview"></iframe>
            </div>
        </div>

        <div style="margin-bottom: 24px;">
            <h2 style="color: var(--accent-blue); font-size: 1.1rem; margin-bottom: 8px; font-weight: 800;">📋 指導の仕方</h2>
            <div class="guidance-img-box">
                <iframe src="https://drive.google.com/file/d/1N9ljXqzCCSnwkn_GYlstqfmdgOvtzWDF/preview"></iframe>
            </div>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active" id="nav-btn-dashboard" onclick="switchPage('dashboard')">
        <span class="nav-icon">📊</span><span>Dashboard</span>
    </button>
    <button class="nav-item" id="nav-btn-roadmap" onclick="switchPage('roadmap')">
        <span class="nav-icon">🏒</span><span>Trainings</span>
    </button>
    <button class="nav-item" id="nav-btn-mindset" onclick="switchPage('mindset')">
        <span class="nav-icon">💡</span><span>Guidelines</span>
    </button>
</nav>

    const levelDisplayNames = { "lv1": "Lv1 基礎習得", "lv2": "Lv2 応用展開", "lv3": "Lv3 実戦準備", "lv4": "Lv4 試合出場", "lv5": "Lv5 レギュラー" };
    let progressStore = JSON.parse(localStorage.getItem('hockey_pro_v5')) || { "lv1": {}, "lv2": {}, "lv3": {}, "lv4": {}, "lv5": {} };

    window.addEventListener('DOMContentLoaded', () => { renderDashboard(); });

    function switchPage(pageId) {
        document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.getElementById('nav-btn-' + pageId).classList.add('active');
        if (pageId === 'dashboard') { renderDashboard(); document.getElementById('current-view-title').innerText = "Dashboard"; }
        else if (pageId === 'roadmap') { switchLevel('lv1', '基礎習得'); }
        else if (pageId === 'mindset') { document.getElementById('current-view-title').innerText = "Guidelines"; }
    }

    function renderDashboard() {
        const listContainer = document.getElementById('dashboard-list');
        listContainer.innerHTML = '';
        let totalItems = 0; let totalCleared = 0;
        
        Object.keys(roadmapData).forEach(lvl => {
            const items = roadmapData[lvl];
            let cleared = Object.keys(progressStore[lvl] || {}).length;
            totalItems += items.length; totalCleared += cleared;
            const percent = Math.round((cleared / items.length) * 100);
            
            const card = document.createElement('div');
            card.className = 'level-progress-card';
            card.onclick = () => { switchPage('roadmap'); switchLevel(lvl, levelDisplayNames[lvl]); };
            card.innerHTML = `
                <div style="flex:1; padding-right:15px;">
                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1rem; margin-bottom:5px;">
                        <span>${levelDisplayNames[lvl]}</span>
                        <span style="color:var(--text-sub); font-size:0.8rem;">${cleared}/${items.length}</span>
                    </div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
                </div><div style="font-weight:900; color:var(--text-sub);">›</div>`;
            listContainer.appendChild(card);
        });
        const totalPercent = Math.round((totalCleared / totalItems) * 100);
        document.getElementById('total-percent').innerText = totalPercent + '%';
        document.getElementById('total-circle').style.background = `conic-gradient(var(--primary-accent) ${totalPercent}%, rgba(255,255,255,0.1) ${totalPercent}%)`;
    }

    function switchLevel(levelKey, label) {
        document.querySelectorAll('.tab-chip').forEach(btn => btn.classList.remove('active'));
        const chip = document.getElementById('chip-' + levelKey);
        if(chip) chip.classList.add('active');
        document.getElementById('current-view-title').innerText = label;
        const container = document.getElementById('level-container');
        container.innerHTML = '';
        
        roadmapData[levelKey].forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'yt-card';
            const isChecked = progressStore[levelKey][index] ? 'checked' : '';
            
            let ytId = '';
            if(item.video_url.includes('http')) {
                const match = item.video_url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/);
                if(match && match[2].length === 11) ytId = match[2];
            }

            let thumbHtml = `<div class="video-mock-bg"><button class="play-button-yt"><div class="play-icon"></div></button></div>`;
            if (ytId) thumbHtml = `<img src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" class="video-thumb">` + thumbHtml;
            else thumbHtml = `<div class="video-thumb" style="background:linear-gradient(45deg,#1f2937,#0f172a); display:flex; align-items:center; justify-content:center; color:#64748b; font-size:0.8rem; padding:10px; text-align:center;">${item.video_url || 'No Video'}</div>` + thumbHtml;

            let packTag = item.pack ? `<span class="meta-tag ${item.pack.includes('有') ? 'active-tag' : ''}">パック:${item.pack}</span>` : '';
            let areaTag = item.area && item.area !== '-' ? `<span class="meta-tag">エリア:${item.area}</span>` : '';
            
            card.innerHTML = `
                <div class="video-player-box" onclick="if('${item.video_url}'.includes('http')) window.open('${item.video_url}', '_blank')">${thumbHtml}</div>
                <div class="video-info-block">
                    <div><label class="custom-checkbox ${isChecked}" id="chk-${levelKey}-${index}"><input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(this, '${levelKey}', ${index})"></label></div>
                    <div style="flex:1">
                        <div class="video-title">${item.shousai}</div>
                        <div class="meta-tag" style="margin-bottom:6px; background:rgba(255,255,255,0.05); color:var(--text-sub); font-size:0.7rem;">${item.daikomoku}</div>
                        <div class="video-meta-tags">${packTag}${areaTag}</div>
                        ${item.point ? `<div class="point-caption">💡 ${item.point}</div>` : ''}
                    </div>
                </div>`;
            container.appendChild(card);
        });
    }

    function toggleCheck(cb, lvl, idx) {
        const label = document.getElementById(`chk-${lvl}-${idx}`);
        if(cb.checked) { label.classList.add('checked'); progressStore[lvl][idx] = true; }
        else { label.classList.remove('checked'); delete progressStore[lvl][idx]; }
        localStorage.setItem('hockey_pro_v5', JSON.stringify(progressStore));
    }
</script>
